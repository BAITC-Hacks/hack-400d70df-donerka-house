services:
  ekt-ai:
    build: .
    image: ekt-ai:latest
    container_name: ekt-ai-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Вставьте ваш OpenAI API Key здесь или создайте .env файл
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EKT_API_BASE_URL=${EKT_API_BASE_URL:-https://ekt.kz/api}
      - EKT_API_USERNAME=${EKT_API_USERNAME:-}
      - EKT_API_PASSWORD=${EKT_API_PASSWORD:-}
      - ACCOUNT_STORE_PATH=${ACCOUNT_STORE_PATH:-data/accounts.json}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
