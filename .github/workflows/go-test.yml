name: Go tests

on:
  push:
    branches:
      - main
      - chatgpt/must-have-7-final
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      - name: Tests
        run: go test ./...
